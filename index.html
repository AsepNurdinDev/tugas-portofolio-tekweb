<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portofolio | Asep Nurdin</title>
    <meta
      name="description"
      content="Asep Nurdin — Founder Mahakarya Digital, Fullstack &amp; DevOps Engineer. Portofolio proyek, keahlian teknis, dan kontak."
    />
    <link rel="icon" type="image/png" href="assets/img/profile.png" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- AOS (scroll animation) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css" />

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: 0 },
                "100%": { opacity: 1 },
              },
              scaleUp: {
                "0%": { opacity: 0, transform: "scale(0.95) translateY(8px)" },
                "100%": { opacity: 1, transform: "scale(1) translateY(0)" },
              },
            },
            animation: {
              "fade-in": "fadeIn 0.25s ease-out",
              "scale-up": "scaleUp 0.25s ease-out",
            },
          },
        },
      };
    </script>

    <!-- Custom stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="w-full bg-slate-50 dark:bg-slate-950 transition-colors duration-300 font-sans tracking-tight"
  >
    <!-- ============ NAVBAR ============ -->
    <header id="navbar-root"></header>

    <!-- ============ HERO SECTION ============ -->
    <section
      class="relative w-full min-h-screen flex items-center justify-center overflow-hidden pt-20 lg:pt-0"
    >
      <!-- Efek Lingkaran Cahaya Premium di Latar Belakang -->
      <div
        class="absolute top-1/4 left-1/4 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-500/10 dark:bg-indigo-500/5 rounded-full blur-[120px] pointer-events-none"
      ></div>
      <div
        class="absolute bottom-1/4 right-1/4 translate-x-1/2 translate-y-1/2 w-[400px] h-[400px] bg-emerald-500/10 dark:bg-emerald-500/5 rounded-full blur-[100px] pointer-events-none"
      ></div>

      <div
        class="mx-auto max-w-5xl w-full px-4 sm:px-6 lg:px-8 py-16 md:grid md:grid-cols-12 md:items-center md:gap-12 relative z-10"
      >
        <!-- KOLOM KIRI - KONTEN UTAMA -->
        <div class="max-w-prose text-left space-y-6 md:col-span-7">
          <!-- Box Status Floating Glassmorphism -->
          <div
            data-aos="fade-right"
            class="flex items-center space-x-4 backdrop-blur-md bg-white/40 dark:bg-slate-900/40 p-3 rounded-2xl border border-white/20 dark:border-slate-800/60 shadow-lg shadow-slate-950/5 w-fit"
          >
            <img
              src="assets/img/mahakaryadigitallogo.jpeg"
              alt="Foto Asep Nurdin"
              class="w-10 h-10 rounded-xl object-cover border border-indigo-500/30 shadow-inner"
            />
            <div class="pr-2">
              <p
                class="text-xs font-bold text-slate-800 dark:text-slate-200 tracking-wider uppercase"
              >
                Founder & Software Engineer
              </p>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span
                  class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"
                ></span>
                <p
                  class="text-[11px] text-slate-500 dark:text-slate-400 font-medium"
                >
                  Mahakarya Digital
                </p>
              </div>
            </div>
          </div>

          <!-- Judul Utama dengan Animasi Mengetik -->
          <h1
            data-aos="fade-up"
            class="text-4xl font-extrabold text-slate-950 dark:text-white sm:text-5xl tracking-tight leading-[1.15]"
          >
            Hi, Saya
            <span class="block mt-1">
              <span
                id="typed-text"
                class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-blue-500 dark:from-indigo-400 dark:to-blue-400 font-extrabold"
              ></span
              ><span
                id="typed-cursor"
                class="inline-block w-[3px] h-[0.9em] -mb-[2px] ml-0.5 bg-indigo-500 dark:bg-indigo-400 align-middle animate-pulse"
              ></span>
            </span>
          </h1>

          <!-- Deskripsi Singkat Berbobot -->
          <p
            data-aos="fade-up"
            data-aos-delay="100"
            class="text-sm md:text-base text-slate-600 dark:text-slate-400 leading-relaxed font-normal"
          >
            Software Engineer sekaligus Founder dari
            <strong>Mahakarya Digital</strong>. Berfokus mendampingi bisnis dan
            instansi mengembangkan aplikasi web performa tinggi, infrastruktur
            backend yang andal, serta solusi cloud modern.
          </p>

          <!-- Tombol Aksi Modern -->
          <div
            class="flex flex-wrap gap-4 pt-2"
            data-aos="fade-up"
            data-aos-delay="200"
          >
            <a
              class="inline-flex items-center justify-center rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-500/10 transition-all duration-300 hover:opacity-95 hover:scale-[1.02] active:scale-[0.98]"
              href="docs/CV_ASEP_NURDIN.pdf"
              download="CV_ASEP_NURDIN.pdf"
            >
              Download CV
            </a>
            <a
              class="inline-flex items-center justify-center rounded-xl border border-slate-200 dark:border-slate-800/80 backdrop-blur-sm bg-white/20 dark:bg-slate-900/20 px-6 py-3 text-sm font-semibold text-slate-700 dark:text-slate-300 shadow-sm transition-all duration-300 hover:bg-slate-100/50 dark:hover:bg-slate-900/50 hover:text-slate-950 dark:hover:text-white hover:scale-[1.02] active:scale-[0.98]"
              href="#project"
            >
              Lihat Project
            </a>
          </div>
        </div>

        <!-- KOLOM KANAN - FOTO UTAMA -->
        <div
          data-aos="fade-zoom-in"
          data-aos-delay="300"
          class="mt-12 md:mt-0 flex justify-center md:col-span-5"
        >
          <!-- Frame Geometris Tech Kontemporer -->
          <div
            class="relative group w-72 h-72 sm:w-80 sm:h-80 rounded-3xl overflow-hidden p-[1px] bg-gradient-to-b from-indigo-500/30 to-transparent dark:from-slate-800 dark:to-transparent shadow-2xl transition-all duration-500 hover:scale-[1.02]"
          >
            <div
              class="w-full h-full rounded-3xl overflow-hidden bg-slate-100 dark:bg-slate-900"
            >
              <img
                src="assets/img/dsc_3883.png"
                alt="Asep Nurdin"
                class="w-full h-full object-cover filter saturate-[0.9] contrast-[1.02]"
              />
            </div>
            <!-- Overlay Glassmorphism Tipis saat di-hover -->
            <div
              class="absolute inset-0 bg-indigo-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"
            ></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ KOMPONEN LANJUTAN ============ -->
    <main>
      <div id="about-root"></div>
      <div id="tools-root"></div>
      <div id="project-root"></div>
      <div id="contact-root"></div>
    </main>

    <footer id="footer-root"></footer>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
